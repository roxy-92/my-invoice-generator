
<main class="invoice-generator">

  <header class="invoice-generator__header">
    <h1>Generador de facturas</h1>
    <p>Crea, personaliza y descarga tus facturas fácilmente.</p>
  </header>

  <div class="invoice-generator__layout">

    <section class="invoice-generator__editor">
      <app-invoice-form
        [invoice]="invoice()"
        (invoiceChange)="updateInvoice($event)"
      />
    </section>

    <section class="invoice-generator__preview">
      <app-invoice-preview
        [invoice]="invoice()"
        [totals]="totals()"
        [dueDate]="dueDate()"
        [taxNote]="taxNote()"
      />
    </section>

  </div>

</main>
